name: Construir APK AURIX

on:
  workflow_dispatch:
  push:
    branches: [ principal ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extraer proyecto AURIX
        run: |
          unzip -q AURIX_MOBILE_PRO_ANDROID_V8_GITHUB.zip -d aurix_build
          cd aurix_build/AURIX_ANDROID_APP_V8/AURIX_ANDROID_APP
          echo "PROJECT_DIR=$PWD" >> "$GITHUB_ENV"

      - name: Compilar APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: AURIX-MOBILE-PRO-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
